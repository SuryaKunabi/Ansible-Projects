<!DOCTYPE html>
<html lang="en">

<head>

    <!-- Character encoding -->
    <meta charset="UTF-8">

    <!-- Responsive design -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Browser tab title -->
    <title>TechWorld - Contact</title>

    <!-- External CSS file -->
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- ================= HEADER ================= -->
    <header>

        <h1>Contact Us</h1>

        <p>We would love to hear from you</p>

    </header>


    <!-- ================= NAVIGATION ================= -->
    <nav>

        <a href="index.html">Home</a>
        <a href="services.html">Services</a>
        <a href="contact.html">Contact</a>

    </nav>


    <!-- ================= CONTACT SECTION ================= -->
    <main class="container">

        <section class="contact">

            <h2>Get in Touch</h2>

            <!-- Contact information -->
            <p><strong>Email:</strong> info@techworld.com</p>

            <p><strong>Phone:</strong> +91 8762409414</p>

            <p><strong>Location:</strong> Bengaluru, India</p>

        </section>


        <!-- ================= CONTACT FORM ================= -->

        <section class="contact">

            <h2>Send Us a Message</h2>

            <!-- Simple form -->
            <!-- This is a static form and does not actually send data -->
            <form>

                <!-- Name field -->
                <label for="name">Name</label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                >


                <!-- Email field -->
                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                >


                <!-- Message field -->
                <label for="message">Message</label>

                <textarea
                    id="message"
                    rows="5"
                    placeholder="Enter your message"
                ></textarea>


                <!-- Submit button -->
                <button type="submit">
                    Send Message
                </button>

            </form>

        </section>

    </main>


    <!-- ================= FOOTER ================= -->
    <footer>

        <p>© 2026 TechWorld. All Rights Reserved.</p>

    </footer>

</body>
</html>
