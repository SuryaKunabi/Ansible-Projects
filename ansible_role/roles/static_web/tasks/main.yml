---
- name: Install Nginx
  apt:
    name: nginx
    state: present
    update_cache: yes

- name: Start and enable Nginx
  service:
    name: nginx
    state: started
    enabled: yes

- name: Copy website files
  copy:
    src: "{{ item }}"
    dest: "/var/www/html/{{ item }}"
    mode: '0644'
  loop:
    - index.html
    - service.html
    - contact.html
    - style.css
